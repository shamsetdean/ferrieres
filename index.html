<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="description" content="Bâtiments publics de Ferrières-en-Brie">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ferrières">
  <title>Ferrières-en-Brie</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.css" rel="stylesheet">
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f4f0;--white:#ffffff;--ink:#1a1a18;--ink-2:#555550;--ink-3:#999992;
      --border:rgba(0,0,0,0.08);--border-md:rgba(0,0,0,0.14);
      --blue:#2563eb;--r:16px;--r-sm:10px;
      --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
      --nav-h:68px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    button,a{font-family:inherit;cursor:pointer;text-decoration:none}
    #map{position:fixed;inset:0;z-index:0}
    .mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-bottom-left,.maptiler-ctrl-bottom-right,.maptiler-ctrl-bottom-left{display:none!important}
    .mapboxgl-ctrl-logo,.maptiler-ctrl-logo{display:none!important}
    .mapboxgl-popup-content,.maplibregl-popup-content{background:var(--white)!important;border:1px solid var(--border-md)!important;border-radius:14px!important;padding:14px 18px!important;font-family:'DM Sans',sans-serif!important;box-shadow:0 4px 24px rgba(0,0,0,0.12)!important}
    .mapboxgl-popup-tip,.maplibregl-popup-tip{display:none!important}
    .popup-name{font-size:17px;font-weight:700;color:var(--ink)}
    .popup-cat{font-size:13px;color:var(--ink-3);margin-top:3px}

    /* HEADER */
    #header{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-t) + 52px) 18px 14px;background:linear-gradient(to bottom,var(--bg) 60%,transparent);pointer-events:none}
    .hdr-inner{display:flex;align-items:center;justify-content:space-between;pointer-events:auto}
    .hdr-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--ink);line-height:1}
    .hdr-sub{font-size:13px;color:var(--ink-3);margin-top:4px;font-weight:400}
    #btn-admin-trigger{opacity:0;pointer-events:auto;width:48px;height:48px;background:none;border:none}

    /* LOCALISER */
    #btn-locate{position:fixed;right:18px;top:calc(var(--safe-t) + 116px);z-index:30;width:56px;height:56px;border-radius:50%;background:var(--white);border:1.5px solid var(--border-md);display:flex;align-items:center;justify-content:center;transition:background 0.15s;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
    #btn-locate:active{background:var(--bg)}
    #btn-locate svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
    #btn-locate.busy{opacity:0.4;pointer-events:none}

    /* BADGE GPS */
    #location-badge{position:fixed;left:18px;right:86px;top:calc(var(--safe-t) + 116px);z-index:30;background:var(--white);border:1.5px solid var(--border-md);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(4px);transition:opacity 0.3s,transform 0.3s;pointer-events:none}
    #location-badge.visible{opacity:1;transform:none;pointer-events:auto}
    .badge-ic{width:34px;height:34px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .badge-ic svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round}
    .badge-lbl{font-size:11px;color:var(--ink-3)}
    .badge-val{font-size:14px;font-weight:700;color:var(--ink);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #badge-close{width:30px;height:30px;border-radius:50%;background:var(--bg);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    #badge-close svg{width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:2.5;stroke-linecap:round}

    /* BOTTOM SHEET */
    #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-radius:24px 24px 0 0;border-top:1.5px solid var(--border);transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);max-height:90vh;display:flex;flex-direction:column;will-change:transform}
    #sheet.collapsed{transform:translateY(calc(100% - 92px))}
    #sheet.peek{transform:translateY(calc(100% - 340px))}
    #sheet.expanded{transform:none}
    .grip-wrap{padding:12px 0 0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
    .grip-bar{width:44px;height:5px;border-radius:3px;background:#d0cec8}
    #sheet-head{padding:10px 18px 14px;flex-shrink:0;cursor:pointer}
    #sheet-title{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.02em}
    #sheet-sub{font-size:14px;color:var(--ink-3);margin-top:4px}
    #sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
    #sheet-body::-webkit-scrollbar{display:none}

    /* FILTRES */
    #filters{padding:0 16px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid var(--border)}
    #filters::-webkit-scrollbar{display:none}
    .fpill{display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0;border:1.5px solid var(--border-md);background:var(--white);color:var(--ink-2);transition:all 0.15s}
    .fpill.active{background:var(--ink);color:var(--white);border-color:var(--ink)}
    .fpill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}

    /* LISTE */
    .brow{display:flex;align-items:center;gap:14px;padding:18px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.12s}
    .brow:active{background:var(--bg)}
    .brow:last-child{border-bottom:none}
    .brow-ic{width:56px;height:56px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .brow-ic svg{width:28px;height:28px;stroke:var(--ink-2);fill:none;stroke-width:1.75;stroke-linecap:round}
    .brow-name{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}
    .brow-meta{font-size:13px;color:var(--ink-3);margin-top:4px}
    .brow-chev svg{width:22px;height:22px;stroke:#d0cec8;fill:none;stroke-width:2.5;stroke-linecap:round}

    /* FICHE PAGE */
    #fiche-page{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden}
    #fiche-page.open{transform:none}
    .ftopbar{background:var(--ink);padding:calc(var(--safe-t) + 14px) 18px 20px;flex-shrink:0}
    .fback{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:rgba(255,255,255,0.75);background:none;border:none;padding:0;margin-bottom:12px}
    .fback svg{width:22px;height:22px;stroke:rgba(255,255,255,0.75);fill:none;stroke-width:2.5;stroke-linecap:round}
    .fcat-badge{display:inline-block;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,0.14);font-size:13px;font-weight:700;color:rgba(255,255,255,0.85);margin-bottom:8px}
    #fiche-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.02em;line-height:1.2}
    .fscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:32px}
    .fscroll::-webkit-scrollbar{display:none}
    .fphoto{width:100%;aspect-ratio:16/9;background:#2a2a28;overflow:hidden}
    .fphoto img{width:100%;height:100%;object-fit:cover;display:block}
    .fphoto-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .fphoto-empty svg{width:48px;height:48px;stroke:#555;fill:none;stroke-width:1.5;opacity:0.4}
    .fsect{padding:18px 18px 0;background:var(--white);margin-top:8px}
    .fsect-title{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
    .frow{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
    .frow:last-child{border-bottom:none}
    .frow-ic{width:46px;height:46px;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .frow-ic svg{width:23px;height:23px;stroke:var(--ink-2);fill:none;stroke-width:1.75;stroke-linecap:round}
    .frow-lbl{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
    .frow-val{font-size:16px;font-weight:500;color:var(--ink);line-height:1.45}
    .ebadge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:14px;font-weight:700}
    .e-ras{background:#dcfce7;color:#15803d}
    .e-moy{background:#fef3c7;color:#b45309}
    .e-ko {background:#fee2e2;color:#b91c1c}
    .e-nd {background:var(--bg);color:var(--ink-3)}
    .photo-btn{width:100%;padding:16px;border-radius:14px;background:var(--ink);border:none;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
    .photo-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

    /* NAV */
    #nav-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--white);border-top:1.5px solid var(--border);display:flex;justify-content:space-around;align-items:stretch;padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
    .nbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;background:none;border:none;color:var(--ink-3);transition:color 0.15s}
    .nbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;transition:stroke 0.15s}
    .nbtn span{font-size:12px;font-weight:700}
    .nbtn.active{color:var(--ink)}
    .nbtn-a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;color:var(--ink-3);font-size:12px;font-weight:700}
    .nbtn-a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

    /* TOAST */
    #toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);left:50%;transform:translateX(-50%) translateY(6px);z-index:70;background:var(--ink);color:#fff;font-size:15px;font-weight:700;padding:13px 24px;border-radius:24px;white-space:nowrap;opacity:0;transition:all 0.25s;pointer-events:none}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* LOADER */
    #loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 0.5s}
    #loader.hidden{opacity:0;pointer-events:none}
    .l-city{font-family:'DM Serif Display',serif;font-size:32px;color:var(--ink);letter-spacing:-0.02em}
    .l-bar{width:180px;height:2px;background:var(--border-md);position:relative;overflow:hidden;border-radius:1px}
    .l-bar::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--ink);animation:lb 1.6s ease-in-out forwards}
    @keyframes lb{to{left:100%}}
    .l-sub{font-size:14px;color:var(--ink-3);font-weight:500}
    #photo-input{display:none}

    @media(min-width:700px){
      #sheet{left:auto;right:0;width:400px;border-radius:0;border-left:1.5px solid var(--border);border-top:none;max-height:100vh;height:100%}
      #sheet.collapsed{transform:translateX(100%)}
      #sheet.peek,#sheet.expanded{transform:none}
      #nav-bar{display:none}
      #fiche-page{left:auto;right:0;width:400px}
      #btn-locate{top:80px;right:420px}
      #location-badge{top:80px;right:484px;left:auto;width:280px}
      #header{padding-top:20px}
    }
  </style>
</head>
<body>

      <div class="hdr-title">Ferrières-en-Brie</div>

    <button class="fpill" data-cat="nature"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21"/><path d="M9.5 9.38C9.5 14 12 17 21 17"/></svg>Nature</button>

<div id="fiche-page">

  <button class="nbtn" data-view="list" aria-label="Liste"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/></svg><span>Liste</span></button>

</nav>

<script>
maptilersdk.config.apiKey = 'AhQ10drEx79exZrx0qNv';

const S = { map:null, uLat:null, uLng:null, filter:'all', sheet:'collapsed', selId:null, admin:false, photos:{} };
const $ = id => document.getElementById(id);

function toast(msg, ms=2600) {
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),ms);
}
function dKm(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function fDist(km){return km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'}

function loadPhotos(){BATIMENTS.forEach(b=>{try{const s=localStorage.getItem('fp_'+b.id);if(s)S.photos[b.id]=s}catch(e){}})}
function savePhoto(id,url){S.photos[id]=url;try{localStorage.setItem('fp_'+id,url)}catch(e){}}

const CAT_IC={
  administration:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>',
  culture:       '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  sport:         '<circle cx="12" cy="12" r="10"/><path d="M4.93 4.93 19.07 19.07"/>',
  education:     '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  nature:        '<path d="M17 8C8 10 5.9 16.17 3.82 21"/><path d="M9.5 9.38C9.5 14 12 17 21 17"/>',
  technique:     '<circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>',
  social:        '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
  service:       '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>'
};
const IC={
  pin:  '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  usr:  '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
  clk:  '<circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/>',
  inf:  '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
  tl:   '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  lk:   '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  img:  '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/>',
  up:   '<polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>'
};
function svg(paths,size=23){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:${size}px;height:${size}px;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round">${paths}</svg>`}
function catSvg(cat,sz=28){return svg(CAT_IC[cat]||CAT_IC.administration,sz)}

function ebadge(e){
  if(!e||e==='—')return`<span class="ebadge e-nd">—</span>`;
  const v=e.toLowerCase();
  if(v.includes('ras')||v.includes('bon'))return`<span class="ebadge e-ras">${e}</span>`;
  if(v.includes('moyen')||v.includes('vétuste'))return`<span class="ebadge e-moy">${e}</span>`;
  return`<span class="ebadge e-nd">${e}</span>`;
}

function setSheet(s){S.sheet=s;$('sheet').className=s}

function visible(){
  const list=BATIMENTS.filter(b=>S.filter==='all'||b.categorie===S.filter);
  if(!S.uLat)return list;
  return[...list].sort((a,b)=>dKm(S.uLat,S.uLng,a.lat,a.lng)-dKm(S.uLat,S.uLng,b.lat,b.lng));
}

function renderList(){
  S.selId=null;
  const list=visible();
  $('sheet-title').textContent='Bâtiments publics';
  $('sheet-sub').textContent=list.length+' lieu'+(list.length>1?'x':'')+' · toucher pour les détails';
  $('sheet-body').innerHTML=list.map(b=>{
    const d=S.uLat?`<span style="margin-left:8px;font-size:12px;color:var(--blue);font-weight:700">${fDist(dKm(S.uLat,S.uLng,b.lat,b.lng))}</span>`:'';
    return`<div class="brow" data-id="${b.id}" role="button" tabindex="0">
      <div class="brow-ic">${catSvg(b.categorie)}</div>
      <div style="flex:1;min-width:0">
        <div class="brow-name">${b.nom}</div>
        <div class="brow-meta">${b.categorie}${d}</div>
      </div>
      <div class="brow-chev">${svg('<polyline points="9,18 15,12 9,6"/>',22)}</div>
    </div>`;
  }).join('');
  $('sheet-body').querySelectorAll('.brow').forEach(r=>{
    const fn=()=>openFiche(r.dataset.id);
    r.addEventListener('click',fn);
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')fn()});
  });
}

function openFiche(id){
  const b=BATIMENTS.find(x=>x.id===id);if(!b)return;
  S.selId=id;
  $('fiche-cat').textContent=b.categorie.charAt(0).toUpperCase()+b.categorie.slice(1);
  $('fiche-title').textContent=b.nom;

  const photo=S.photos[id]||b.photo||null;
  const photoBlock=photo
    ?`<div class="fphoto"><img src="${photo}" alt="Photo de ${b.nom}" onerror="this.parentElement.innerHTML='<div class=\\'fphoto-empty\\'>${svg(IC.img,48)}</div>'"></div>`
    :`<div class="fphoto"><div class="fphoto-empty">${svg(IC.img,48)}</div></div>`;

  const adminBlock=S.admin
    ?`<div style="padding:16px 18px;background:var(--white);margin-top:8px">
        <button class="photo-btn" onclick="triggerPhoto('${id}')">${svg(IC.up,22)} ${photo?'Changer la photo':'Ajouter une photo'}</button>
      </div>`:'';

  const fields=[
    b.adresse&&b.adresse!=='—'?{k:'pin',l:'Adresse',v:b.adresse}:null,
    b.capacite&&b.capacite!=='—'?{k:'usr',l:'Capacité',v:b.capacite}:null,
    b.horaires&&b.horaires!=='—'?{k:'clk',l:'Horaires',v:b.horaires}:null,
    b.description?{k:'inf',l:'Description',v:b.description}:null,
    b.activites&&b.activites!=='—'?{k:'lk',l:'Activités',v:b.activites}:null,
    b.equipements&&b.equipements!=='—'?{k:'tl',l:'Équipements',v:b.equipements}:null,
    b.accessibilite&&b.accessibilite!=='—'?{k:'inf',l:'Accessibilité',v:b.accessibilite}:null,
  ].filter(Boolean);

  const infoBlock=`<div class="fsect">
    <div class="fsect-title">Informations</div>
    ${fields.map(f=>`<div class="frow"><div class="frow-ic">${svg(IC[f.k])}</div><div><div class="frow-lbl">${f.l}</div><div class="frow-val">${f.v}</div></div></div>`).join('')}
  </div>`;

  const etatBlock=`<div class="fsect" style="margin-top:8px;padding-bottom:16px">
    <div class="fsect-title">État du bâtiment</div>
    <div class="frow"><div class="frow-ic">${svg(IC.inf)}</div><div><div class="frow-lbl">État général</div><div class="frow-val">${ebadge(b.etat)}</div></div></div>
    ${b.travaux_recents&&b.travaux_recents!=='—'&&b.travaux_recents!=='RAS'?`<div class="frow"><div class="frow-ic">${svg(IC.tl)}</div><div><div class="frow-lbl">Travaux récents</div><div class="frow-val">${b.travaux_recents}</div></div></div>`:''}
    ${b.travaux_prevus&&b.travaux_prevus!=='—'&&b.travaux_prevus!=='RAS'?`<div class="frow"><div class="frow-ic">${svg(IC.tl)}</div><div><div class="frow-lbl">Travaux à prévoir</div><div class="frow-val">${b.travaux_prevus}</div></div></div>`:''}
  </div>`;

  $('fscroll').innerHTML=photoBlock+adminBlock+infoBlock+etatBlock;
  $('fiche-page').classList.add('open');
  $('fscroll').scrollTop=0;
  S.map.flyTo({center:[b.lng,b.lat],zoom:Math.max(S.map.getZoom(),16),duration:600});
}

function closeFiche(){$('fiche-page').classList.remove('open');S.selId=null}
$('fiche-back').addEventListener('click',closeFiche);

function triggerPhoto(id){if(!S.admin)return;$('photo-input').setAttribute('data-id',id);$('photo-input').click()}
window.triggerPhoto=triggerPhoto;

$('photo-input').addEventListener('change',function(){
  if(!S.admin)return;
  const id=this.getAttribute('data-id'),file=this.files[0];
  if(!file||!id)return;
  const r=new FileReader();
  r.onload=e=>{savePhoto(id,e.target.result);toast('Photo enregistrée');openFiche(id)};
  r.readAsDataURL(file);this.value='';
});

const ADMIN_HASH='8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
async function hashStr(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function promptAdmin(){
  const p=prompt('Mot de passe administrateur :');if(!p)return;
  if(await hashStr(p)===ADMIN_HASH){S.admin=true;toast('Mode administrateur activé');if(S.selId)openFiche(S.selId)}
  else toast('Mot de passe incorrect.');
}
let aTimer;
$('btn-admin-trigger').addEventListener('pointerdown',()=>{aTimer=setTimeout(promptAdmin,1500)});
$('btn-admin-trigger').addEventListener('pointerup',()=>clearTimeout(aTimer));
$('btn-admin-trigger').addEventListener('pointercancel',()=>clearTimeout(aTimer));

function requestLocation(){
  if(!('geolocation' in navigator)){toast('Géolocalisation non disponible.');return}
  $('btn-locate').classList.add('busy');
  navigator.geolocation.getCurrentPosition(pos=>{
    S.uLat=pos.coords.latitude;S.uLng=pos.coords.longitude;
    $('btn-locate').classList.remove('busy');
    if(S.map.getSource('uloc')){
      S.map.getSource('uloc').setData({type:'Feature',geometry:{type:'Point',coordinates:[S.uLng,S.uLat]}});
    } else {
      S.map.addSource('uloc',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:[S.uLng,S.uLat]}}});
      S.map.addLayer({id:'u-halo',type:'circle',source:'uloc',paint:{'circle-radius':20,'circle-color':'#2563eb','circle-opacity':0.15}});
      S.map.addLayer({id:'u-dot', type:'circle',source:'uloc',paint:{'circle-radius':9,'circle-color':'#2563eb','circle-stroke-width':3,'circle-stroke-color':'#fff'}});
    }
    S.map.flyTo({center:[S.uLng,S.uLat],zoom:15.5,duration:900});
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${S.uLat}&lon=${S.uLng}&format=json&accept-language=fr`)
      .then(r=>r.json()).then(d=>{
        const a=d.address||{};
        $('badge-addr').textContent=[a.road,a.suburb||a.village||a.town||a.city].filter(Boolean).join(', ')||'Position localisée';
        $('location-badge').classList.add('visible');
        renderList();
      }).catch(()=>{
        $('badge-addr').textContent=`${S.uLat.toFixed(4)}, ${S.uLng.toFixed(4)}`;
        $('location-badge').classList.add('visible');
      });
  },err=>{
    $('btn-locate').classList.remove('busy');
    toast({1:'Accès GPS refusé.',2:'GPS indisponible.',3:'Délai dépassé.'}[err.code]||'GPS impossible.');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
$('btn-locate').addEventListener('click',requestLocation);
$('badge-close').addEventListener('click',()=>$('location-badge').classList.remove('visible'));

function initMap(){
  S.map=new maptilersdk.Map({
    container:'map',
    style:'https://api.maptiler.com/maps/dataviz-light/style.json?key=AhQ10drEx79exZrx0qNv',
    center:[2.7046,48.8216],zoom:14.2,pitch:0,bearing:0,attributionControl:false
  });
  S.map.on('load',()=>{
    S.map.getStyle().layers.forEach(l=>{
      const id=l.id.toLowerCase();
      if(id.includes('poi')||id.includes('shop')||id.includes('amenity')||id.includes('transit')||id.includes('place-of-worship')){
        try{S.map.setLayoutProperty(l.id,'visibility','none')}catch(e){}
      }
    });
    S.map.addSource('b',{type:'geojson',data:{type:'FeatureCollection',features:BATIMENTS.map(b=>({type:'Feature',properties:{id:b.id,nom:b.nom,categorie:b.categorie},geometry:{type:'Point',coordinates:[b.lng,b.lat]}}))}});
    S.map.addLayer({id:'b-halo',type:'circle',source:'b',paint:{'circle-radius':24,'circle-color':'#1a1a18','circle-opacity':0.07}});
    S.map.addLayer({id:'b-dot',type:'circle',source:'b',paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],12,7,17,14],
      'circle-color':'#1a1a18','circle-stroke-width':3,'circle-stroke-color':'#ffffff','circle-opacity':0.92
    }});
    S.map.addLayer({id:'b-lbl',type:'symbol',source:'b',minzoom:14.5,layout:{
      'text-field':['get','nom'],'text-font':['DIN Pro Medium','Arial Unicode MS Regular'],
      'text-size':13,'text-offset':[0,1.8],'text-anchor':'top','text-max-width':10
    },paint:{'text-color':'#1a1a18','text-halo-color':'rgba(255,255,255,0.96)','text-halo-width':2}});

    const pop=new maptilersdk.Popup({closeButton:false,closeOnClick:false,offset:20});
    S.map.on('mouseenter','b-dot',e=>{
      S.map.getCanvas().style.cursor='pointer';
      const p=e.features[0].properties;
      pop.setLngLat(e.features[0].geometry.coordinates).setHTML(`<div class="popup-name">${p.nom}</div><div class="popup-cat">${p.categorie}</div>`).addTo(S.map);
    });
    S.map.on('mouseleave','b-dot',()=>{S.map.getCanvas().style.cursor='';pop.remove()});
    S.map.on('click','b-dot',e=>{openFiche(e.features[0].properties.id);setSheet('peek')});
    S.map.on('click',e=>{
      if(!S.map.queryRenderedFeatures(e.point,{layers:['b-dot']}).length){closeFiche();renderList();setSheet('collapsed')}
    });
    setTimeout(()=>{$('loader').classList.add('hidden');renderList();setSheet('collapsed')},1400);
  });
}

document.querySelectorAll('.fpill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.fpill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');S.filter=p.dataset.cat;
    const f=S.filter==='all'?null:['==',['get','categorie'],S.filter];
    if(S.map&&S.map.getLayer('b-dot')){S.map.setFilter('b-dot',f);S.map.setFilter('b-halo',f);S.map.setFilter('b-lbl',f)}
    renderList();setSheet('peek');
  });
});

[$('grip'),$('sheet-head')].forEach(el=>{
  el.addEventListener('click',()=>{
    if(S.sheet==='collapsed')setSheet('peek');
    else if(S.sheet==='peek')setSheet('expanded');
    else setSheet('peek');
  });
});

document.querySelectorAll('.nbtn[data-view]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nbtn[data-view]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const v=btn.dataset.view;
    if(v==='map'){closeFiche();setSheet('collapsed')}
    else if(v==='list'){closeFiche();renderList();setSheet('expanded')}
  });
});

loadPhotos();
initMap();
</script>
</body>
</html>
