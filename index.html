<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0B12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ferrières · Bâtiments</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.css" rel="stylesheet">
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.umd.min.js"></script>
<script src="./data.js"></script>
<style>
/* ═══ TOKENS ═══════════════════════════════════════ */
:root{
  --f:'Manrope',system-ui,sans-serif;
  --c1:#0A0B12; --c2:#1E1F2E; --c3:#3A3B4E; --cm:#8A8A9E;
  --acc:#5B7FFF; --acc-a:rgba(91,127,255,.18);
  --ok:#30D158; --warn:#F5A623; --err:#FF453A;
  --gl:rgba(255,255,255,.72); --glb:blur(36px) saturate(200%);
  --gls:0 8px 40px rgba(0,0,0,.1),0 2px 10px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.8);
  --dk:rgba(10,11,18,.80); --dkb:blur(28px) saturate(180%);
  --dks:0 12px 48px rgba(0,0,0,.3),0 3px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.08);
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;--r20:20px;--r28:28px;--rpill:99px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --car-h:148px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0B12;
  font-family:var(--f);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;color:var(--c1);}

/* ═══ KEYFRAMES ═════════════════════════════════════ */
@keyframes pulse-out{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.5);opacity:0}}
@keyframes slide-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slide-down{from{transform:translateY(0);opacity:1}to{transform:translateY(100%);opacity:0}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes card-in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.88);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}

/* ═══ MAP ═══════════════════════════════════════════ */
#map{position:fixed;inset:0;z-index:0;}

/* ═══ MARKERS ════════════════════════════════════════
   Glowing dot orbs — zero icons, zero borders
═══════════════════════════════════════════════════ */
.mk-wrap{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.mk-dot{width:14px;height:14px;border-radius:50%;position:relative;z-index:2;transition:width .2s,height .2s,box-shadow .2s;}
.mk-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:1.5px solid;animation:pulse-out 2.8s ease-out infinite;pointer-events:none;z-index:1;}
.mk-wrap.hi .mk-dot{width:20px;height:20px;}
.mk-wrap .mk-label{
  position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);
  background:var(--dk);backdrop-filter:var(--dkb);-webkit-backdrop-filter:var(--dkb);
  color:#fff;padding:5px 12px;border-radius:var(--rpill);
  font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:3;
  transform:translateX(-50%) translateY(4px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.mk-wrap.hi .mk-label{opacity:1;transform:translateX(-50%) translateY(0);}

/* ═══ TOP CORNER — city badge + locate ═══════════════ */
#top-ui{
  position:fixed;top:calc(16px + var(--st));left:16px;right:16px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:100;pointer-events:none;
}
#city-badge{
  display:flex;align-items:center;gap:10px;
  background:var(--dk);backdrop-filter:var(--dkb);-webkit-backdrop-filter:var(--dkb);
  border:1px solid rgba(255,255,255,.10);border-radius:var(--rpill);
  padding:10px 18px 10px 12px;
  box-shadow:var(--dks);pointer-events:auto;cursor:default;user-select:none;
}
#city-badge .cb-icon{width:34px;height:34px;border-radius:var(--r12);background:var(--acc);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#city-badge .cb-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;}
#city-badge .cb-text .n{font-size:14px;font-weight:800;color:#fff;letter-spacing:.2px;}
#city-badge .cb-text .s{font-size:10px;color:rgba(255,255,255,.38);font-weight:500;letter-spacing:.4px;text-transform:uppercase;}
#adm-glow{width:8px;height:8px;border-radius:50%;background:var(--acc);display:none;flex-shrink:0;}

#btn-locate{
  width:50px;height:50px;border-radius:var(--r16);
  background:var(--dk);backdrop-filter:var(--dkb);-webkit-backdrop-filter:var(--dkb);
  border:1px solid rgba(255,255,255,.10);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.65);
  box-shadow:var(--dks);pointer-events:auto;
  transition:color .2s,transform .14s;
}
#btn-locate:active{transform:scale(.9);}
#btn-locate.on{color:var(--acc);}
#btn-locate svg{width:22px;height:22px;}

/* ═══ CATEGORY RAIL — right side vertical ═══════════ */
#cat-rail{
  position:fixed;right:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:100;
}
.cr-btn{
  width:46px;height:46px;border-radius:var(--r16);
  background:var(--dk);backdrop-filter:var(--dkb);-webkit-backdrop-filter:var(--dkb);
  border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .18s,border-color .18s,transform .13s;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  position:relative;
}
.cr-btn:active{transform:scale(.88);}
.cr-btn svg{width:17px;height:17px;stroke:rgba(255,255,255,.45);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .18s;}
.cr-btn.on{border-color:rgba(255,255,255,.25);}
.cr-btn.on svg{stroke:#fff;}
.cr-btn .cr-dot{width:6px;height:6px;border-radius:50%;position:absolute;top:7px;right:7px;}

/* ═══ CAROUSEL — horizontal snap ════════════════════ */
#carousel-shell{
  position:fixed;bottom:0;left:0;right:0;
  z-index:100;
  padding-bottom:calc(16px + var(--sb));
  background:linear-gradient(to top,rgba(6,8,18,.72) 0%,rgba(6,8,18,.3) 60%,transparent 100%);
}
#carousel{
  display:flex;gap:12px;
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:20px 16px 0;
}
#carousel::-webkit-scrollbar{display:none;}
.c-card{
  flex-shrink:0;width:200px;height:var(--car-h);
  scroll-snap-align:start;
  background:var(--gl);backdrop-filter:var(--glb);-webkit-backdrop-filter:var(--glb);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--r20);
  box-shadow:var(--gls);
  padding:16px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .18s,box-shadow .18s;
  animation:card-in .3s ease both;
}
.c-card:active{transform:scale(.96);}
.c-card .cc-top{display:flex;align-items:flex-start;justify-content:space-between;}
.c-card .cc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.c-card .cc-dist{font-size:10px;font-weight:600;color:var(--cm);background:rgba(0,0,0,.06);padding:2px 8px;border-radius:var(--rpill);}
.c-card .cc-nm{font-size:15px;font-weight:800;color:var(--c1);line-height:1.25;margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-card .cc-bot{display:flex;align-items:center;justify-content:space-between;}
.c-card .cc-cat{font-size:11px;font-weight:600;color:var(--cm);}
.c-card .cc-arr svg{width:14px;height:14px;stroke:rgba(0,0,0,.25);fill:none;stroke-width:2;}
.c-card.sel{background:rgba(255,255,255,.90);box-shadow:0 16px 56px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.9);}

/* ═══ DETAIL PANEL — full screen, slides up ══════════ */
#detail{
  position:fixed;inset:0;z-index:300;
  background:rgba(252,251,249,.97);
  backdrop-filter:blur(48px);-webkit-backdrop-filter:blur(48px);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);
  transition:transform .46s cubic-bezier(0.32,0.72,0,1);
  will-change:transform;
}
#detail.on{transform:translateY(0);}

/* Detail header */
#det-top{
  display:flex;align-items:center;gap:12px;
  padding:calc(18px + var(--st)) 20px 14px;
  flex-shrink:0;
  border-bottom:1px solid rgba(0,0,0,.06);
}
#det-close{
  width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.06);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--c1);flex-shrink:0;
  transition:background .15s,transform .13s;
}
#det-close:active{background:rgba(0,0,0,.12);transform:scale(.9);}
#det-close svg{width:18px;height:18px;}
#det-name{flex:1;font-size:19px;font-weight:800;color:var(--c1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px;}
#det-nav{display:flex;gap:6px;}
.det-nav-btn{width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.05);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--c3);transition:background .15s;}
.det-nav-btn:active{background:rgba(0,0,0,.10);}
.det-nav-btn svg{width:16px;height:16px;}

/* Detail scrollable body */
#det-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(var(--sb) + 20px);}
#det-body::-webkit-scrollbar{display:none;}

/* Category ribbon */
#det-cat{display:flex;align-items:center;gap:7px;padding:12px 0 0;}
.det-cat-dot{width:8px;height:8px;border-radius:50%;}
#det-cat-label{font-size:12px;font-weight:700;color:var(--cm);text-transform:uppercase;letter-spacing:.5px;}

/* Photo block */
#det-photo{
  width:100%;height:210px;border-radius:var(--r20);
  overflow:hidden;margin:12px 0;
  background:rgba(0,0,0,.06);
  border:1px solid rgba(0,0,0,.06);
  position:relative;
}
.ph-empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.ph-empty svg{width:38px;height:38px;stroke:rgba(0,0,0,.2);fill:none;stroke-width:1.5;}
.ph-empty span{font-size:12px;color:rgba(0,0,0,.3);font-weight:500;}
.ph-spinner-wrap{width:100%;height:100%;display:none;align-items:center;justify-content:center;}
.ph-spin{width:24px;height:24px;border:3px solid rgba(0,0,0,.08);border-top-color:var(--c1);border-radius:50%;animation:spin .7s linear infinite;}
#det-ph-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}

/* Info glass panels */
.ig{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r20);
  box-shadow:0 6px 24px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.8);
  margin-bottom:10px;overflow:hidden;
}
.ig .ir{padding:13px 16px;border-bottom:1px solid rgba(0,0,0,.055);}
.ig .ir:last-child{border-bottom:none;}
.ig .il{font-size:10px;font-weight:700;color:var(--cm);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.ig .iv{font-size:14px;font-weight:500;color:var(--c1);line-height:1.45;}
.ig .iv.na{color:var(--cm);font-style:italic;font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.chip{font-size:10px;font-weight:600;padding:3px 10px;border-radius:var(--rpill);background:rgba(0,0,0,.06);color:var(--c3);}
.ebadge{padding:3px 10px;border-radius:var(--rpill);font-size:11px;font-weight:700;display:inline-block;}
.e-ok{background:rgba(48,209,88,.12);color:#1A7D36;}
.e-mid{background:rgba(245,166,35,.14);color:#8B5A00;}
.e-bad{background:rgba(255,69,58,.12);color:#C0392B;}
.tw-mid{color:#B25C00;font-weight:600;}
.tw-bad{color:#C0392B;font-weight:600;}

/* AR button */
#det-ar{
  width:100%;height:54px;border:none;border-radius:var(--rpill);
  background:var(--c1);color:#fff;
  font-family:var(--f);font-size:14px;font-weight:700;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;box-shadow:0 12px 36px rgba(0,0,0,.18);
  transition:transform .14s,opacity .14s;margin-top:4px;
}
#det-ar:active{transform:scale(.97);opacity:.9;}
#det-ar svg{width:18px;height:18px;}

/* ═══ ADMIN PANEL — full screen ══════════════════════ */
#admin-panel{
  position:fixed;inset:0;z-index:500;
  background:rgba(10,11,18,.96);
  backdrop-filter:blur(48px);-webkit-backdrop-filter:blur(48px);
  display:none;flex-direction:column;overflow:hidden;
  animation:fade-in .28s ease;
}
#admin-panel.on{display:flex;}

/* Admin header */
#adm-hdr{
  display:flex;align-items:center;gap:12px;
  padding:calc(20px + var(--st)) 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.adm-close{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.7);transition:background .15s;}
.adm-close:active{background:rgba(255,255,255,.14);}
.adm-close svg{width:18px;height:18px;}
#adm-title{flex:1;font-size:18px;font-weight:800;color:#fff;letter-spacing:-.2px;}
#adm-mode-label{font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-a);
  padding:4px 10px;border-radius:var(--rpill);}

/* Admin body */
#adm-body{flex:1;overflow-y:auto;padding:20px 16px calc(var(--sb)+20px);}
#adm-body::-webkit-scrollbar{display:none;}

/* Admin section: building grid */
#adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ag-item{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r16);overflow:hidden;cursor:pointer;
  transition:background .18s,transform .14s;
}
.ag-item:active{background:rgba(255,255,255,.10);transform:scale(.97);}
.ag-photo{width:100%;height:80px;position:relative;background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;}
.ag-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ag-photo .ag-ph-ico{opacity:.25;}
.ag-photo .ag-ph-ico svg{width:24px;height:24px;stroke:rgba(255,255,255,.6);fill:none;}
.ag-photo .ag-has-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok);}
.ag-info{padding:10px 12px;}
.ag-info .ag-nm{font-size:12px;font-weight:700;color:rgba(255,255,255,.85);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-info .ag-cat{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px;}

/* Photo manager (inside admin) */
#pm{display:none;}
#pm.on{display:block;}
#pm-back{display:flex;align-items:center;gap:8px;padding:0 0 20px;cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;background:transparent;border:none;font-family:var(--f);}
#pm-back svg{width:18px;height:18px;stroke:var(--acc);}
#pm-bldg{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-.4px;}
#pm-cat{font-size:12px;color:rgba(255,255,255,.4);font-weight:500;margin-bottom:20px;}

/* Current photo preview (large) */
#pm-current{
  width:100%;height:220px;border-radius:var(--r20);
  overflow:hidden;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  position:relative;margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;
}
#pm-current img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
#pm-current .pm-ph-ico svg{width:40px;height:40px;stroke:rgba(255,255,255,.2);fill:none;stroke-width:1.5;}

/* Preview new photo before saving */
#pm-preview-box{
  width:100%;border-radius:var(--r20);overflow:hidden;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  margin-bottom:14px;display:none;
}
#pm-preview-box.on{display:block;}
#pm-preview-box img{width:100%;max-height:220px;object-fit:contain;display:block;}
.pm-preview-info{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.pm-size{font-size:11px;color:rgba(255,255,255,.5);font-weight:500;}
.pm-size strong{color:rgba(255,255,255,.8);}

/* Admin action buttons */
.adm-btn-row{display:flex;gap:8px;margin-bottom:10px;}
.adm-btn{flex:1;height:50px;border-radius:var(--rpill);border:none;
  font-family:var(--f);font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .13s,opacity .13s;}
.adm-btn:active{transform:scale(.96);opacity:.85;}
.adm-btn svg{width:16px;height:16px;}
.adm-btn.primary{background:var(--acc);color:#fff;}
.adm-btn.secondary{background:rgba(255,255,255,.10);color:rgba(255,255,255,.8);}
.adm-btn.danger{background:rgba(255,69,58,.18);color:#FF453A;}
.adm-btn.save{background:var(--ok);color:#fff;}
.adm-btn.cancel-preview{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);}
.adm-divider{height:1px;background:rgba(255,255,255,.07);margin:16px 0;}

/* ═══ ADMIN PASSWORD MODAL ═══════════════════════════ */
#adm-modal{
  position:fixed;inset:0;z-index:600;
  background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
#adm-modal.on{display:flex;}
#adm-modal-box{
  width:100%;max-width:320px;
  background:rgba(20,22,36,.95);border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r28);padding:28px 22px;
  box-shadow:0 32px 80px rgba(0,0,0,.5);
  animation:pop .3s ease;
}
#adm-modal-box h3{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px;margin-bottom:5px;}
#adm-modal-box p{font-size:13px;color:rgba(255,255,255,.44);margin-bottom:18px;line-height:1.5;}
#adm-pwd{width:100%;height:52px;background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.12);border-radius:var(--r12);
  padding:0 16px;font-size:16px;font-family:var(--f);color:#fff;outline:none;
  transition:border-color .2s;}
#adm-pwd::placeholder{color:rgba(255,255,255,.3);}
#adm-pwd:focus{border-color:var(--acc);}
#adm-err{font-size:11px;color:var(--err);min-height:14px;margin-top:5px;}
.adm-modal-btns{display:flex;gap:8px;margin-top:14px;}
.ambt{flex:1;height:50px;border-radius:var(--rpill);border:none;
  font-size:14px;font-weight:700;font-family:var(--f);cursor:pointer;}
.ambt.s{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);}
.ambt.p{background:var(--acc);color:#fff;}

/* ═══ LOC BADGE ═════════════════════════════════════ */
#loc-badge{
  position:fixed;top:calc(var(--st) + 82px);left:50%;
  transform:translateX(-50%) translateY(-8px);
  background:var(--dk);backdrop-filter:var(--dkb);-webkit-backdrop-filter:var(--dkb);
  border:1px solid rgba(255,255,255,.1);color:#fff;
  padding:8px 18px;border-radius:var(--rpill);
  font-size:12px;font-weight:600;

/* ═══ TOAST ═════════════════════════════════════════ */
#toast{

  box-shadow:var(--dks);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ═══ DESKTOP ≥ 1024px ═══════════════════════════════ */
@media(min-width:1024px){
  #cat-rail{display:none;}
  #carousel-shell{left:360px;}
  #top-ui{left:376px;}
  #detail{left:360px;}
  #loc-badge{left:calc(360px + 50%);}

  #desktop-panel{
    display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;width:360px;
    background:rgba(10,11,18,.96);backdrop-filter:blur(48px);-webkit-backdrop-filter:blur(48px);
    border-right:1px solid rgba(255,255,255,.07);z-index:200;overflow:hidden;
  }
  #dp-hdr{padding:calc(20px + var(--st)) 20px 16px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
  #dp-hdr .dp-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px;}
  #dp-hdr .dp-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:3px;font-weight:500;}
  #dp-filt{padding:12px 16px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
  #dp-filt::-webkit-scrollbar{display:none;}
  .dpf{flex-shrink:0;height:30px;padding:0 12px;border-radius:var(--rpill);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
    font-size:11px;font-weight:600;color:rgba(255,255,255,.5);font-family:var(--f);cursor:pointer;
    display:flex;align-items:center;gap:5px;transition:all .16s;white-space:nowrap;}
  .dpf.on{background:var(--acc);border-color:var(--acc);color:#fff;}
  .dpf .dfd{width:5px;height:5px;border-radius:50%;}
  #dp-list{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;}
  #dp-list::-webkit-scrollbar{display:none;}
  .dp-row{display:flex;align-items:center;gap:12px;padding:13px 20px;
    border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .13s;}
  .dp-row:active,.dp-row:hover{background:rgba(255,255,255,.05);}
  .dp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dp-body{flex:1;min-width:0;}
  .dp-nm{font-size:14px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Desktop map: no separate detail panel, map + detail side-by-side */
  #map{left:360px;}
  #admin-panel{left:360px;}
}

<script>
/* ══════════════════════════════════════════════════════
   FERRIÈRES-EN-BRIE — Bâtiments Publics
   Fresh architecture. New everything.
══════════════════════════════════════════════════════ */
var ADMIN_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
var IS_DK = window.matchMedia("(min-width:1024px)");
var PM_MAX_DIM = 1080;
var PM_QUALITY = 0.82;

/* ICONS */
var IC = {
  bld:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M10 6h4"/><path d="M10 10h4"/></svg>',
  mus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/></svg>',
  spt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93a10 10 0 0 1 14.14 0"/></svg>',
  lf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/></svg>',
  wrn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
  hrt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  drp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>',
  chv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
};
function catIcon(c){return({administration:IC.bld,culture:IC.mus,sport:IC.spt,nature:IC.lf,technique:IC.wrn,social:IC.hrt,infrastructure:IC.drp})[c]||IC.bld;}
function catColor(c){return(CATEGORIES[c]||{color:"#475569"}).color;}
function catLabel(c){return(CATEGORIES[c]||{label:c}).label;}
function rgba(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return"rgba("+r+","+g+","+b+","+a+")";}
function skip(v){return v===null||v===undefined||v===""||v==="--"||v==="-";}
function fmtBytes(bytes){if(bytes<1024)return bytes+"o";if(bytes<1048576)return Math.round(bytes/1024)+"Ko";return(bytes/1048576).toFixed(1)+"Mo";}

/* STATE */
var S={
  map:null,markers:{},uMk:null,
  lat:null,lng:null,
  filter:"all",cur:null,curIdx:0,
  isAdm:false,photos:{},
  pmBuilding:null,pmPending:null,
  pt:null
};

/* UTILS */
function hav(a,b,c,d){var R=6371000,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)*Math.sin(dn/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function fd(m){return m<1000?Math.round(m)+"m":(m/1000).toFixed(1)+"km";}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");setTimeout(function(){t.classList.remove("on");},2600);}

/* IMAGE COMPRESSION */
function compressImage(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      var ratio=Math.min(PM_MAX_DIM/w,PM_MAX_DIM/h,1);
      var cw=Math.round(w*ratio),ch=Math.round(h*ratio);
      var canvas=document.createElement("canvas");
      canvas.width=cw;canvas.height=ch;
      canvas.getContext("2d").drawImage(img,0,0,cw,ch);
      var result=canvas.toDataURL("image/jpeg",PM_QUALITY);
      /* base64 to bytes: each char = 0.75 bytes approx */
      var compBytes=Math.round(result.length*0.75);
      cb(result,file.size,compBytes);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* PHOTO STORAGE */
function loadPhotos(){
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("ph_")===0){var v=localStorage.getItem(k);if(v&&v.indexOf("data:image")===0)S.photos[k.slice(3)]=v;else localStorage.removeItem(k);}}}catch(e){}
}
function getPhoto(b){
  if(S.photos[b.id])return S.photos[b.id];
  if(b.photoData&&b.photoData.indexOf("data:image")===0)return b.photoData;
  return null;
}
function savePhoto(id,data){
  try{localStorage.setItem("ph_"+id,data);S.photos[id]=data;toast("Photo enregistrée");}
  catch(e){toast("Stockage plein — photo non sauvegardée");}
}
function deletePhoto(id){
  try{localStorage.removeItem("ph_"+id);delete S.photos[id];toast("Photo supprimée");}
  catch(e){}
}
function applyPhoto(phEmptyEl,phLdEl,phImgEl,b){
  var d=getPhoto(b);
  phImgEl.style.display="none";phEmptyEl.style.display="flex";if(phLdEl)phLdEl.style.display="none";
  if(!d)return;
  phEmptyEl.style.display="none";if(phLdEl)phLdEl.style.display="flex";
  var t=new Image();
  t.onload=function(){phImgEl.src=d;phImgEl.style.display="block";if(phLdEl)phLdEl.style.display="none";};
  t.onerror=function(){phEmptyEl.style.display="flex";if(phLdEl)phLdEl.style.display="none";};
  t.src=d;
}

/* MAP */
function initMap(){
  maptilersdk.config.apiKey=MAPTILER_KEY;
  S.map=new maptilersdk.Map({
    container:"map",
    style:"https://api.maptiler.com/maps/dataviz-light/style.json?key="+MAPTILER_KEY,
    center:[2.7050,48.8215],zoom:14,minZoom:11,maxZoom:19,
    attributionControl:false,navigationControl:false
  });
  S.map.on("load",function(){
    (S.map.getStyle().layers||[]).forEach(function(l){
      if(/(poi|symbol|icon|label)/i.test(l.id)){try{S.map.setLayoutProperty(l.id,"visibility","none");}catch(e){}}
    });
    addMarkers();
  });
  S.map.on("click",function(){hlMarker(null);});
}

/* MARKERS — glow orbs */
function addMarkers(){
  BATIMENTS.forEach(function(b,i){
    if(!b.lat||!b.lng)return;
    var co=catColor(b.categorie);
    var wrap=document.createElement("div");
    wrap.className="mk-wrap";
    var ring=document.createElement("div");ring.className="mk-ring";
    ring.style.borderColor=co;ring.style.animationDelay=(i%7*0.42)+"s";
    var dot=document.createElement("div");dot.className="mk-dot";
    dot.style.background=co;
    dot.style.boxShadow="0 0 0 4px "+rgba(co,.24)+",0 0 0 8px "+rgba(co,.10);
    var lbl=document.createElement("div");lbl.className="mk-label";lbl.textContent=b.nom;
    wrap.appendChild(ring);wrap.appendChild(dot);wrap.appendChild(lbl);
    wrap.addEventListener("click",function(e){e.stopPropagation();openDetail(b.id,true);});
    var mk=new maptilersdk.Marker({element:wrap}).setLngLat([b.lng,b.lat]).addTo(S.map);
    S.markers[b.id]={mk:mk,el:wrap};
  });
}
function updateMarkers(){
  BATIMENTS.forEach(function(b){
    var m=S.markers[b.id];if(!m)return;
    m.el.style.display=(S.filter==="all"||b.categorie===S.filter)?"flex":"none";
  });
}
function hlMarker(id){
  Object.keys(S.markers).forEach(function(k){S.markers[k].el.classList.remove("hi");});
  if(id&&S.markers[id])S.markers[id].el.classList.add("hi");
}

/* CATEGORY RAIL */
var CATS=[
  {cat:"all",icon:IC.grid,label:"Tous"},
  {cat:"administration",icon:IC.bld,label:"Administration"},
  {cat:"culture",icon:IC.mus,label:"Culture"},
  {cat:"sport",icon:IC.spt,label:"Sport"},
  {cat:"nature",icon:IC.lf,label:"Nature"},
  {cat:"technique",icon:IC.wrn,label:"Technique"},
  {cat:"social",icon:IC.hrt,label:"Social"},
  {cat:"infrastructure",icon:IC.drp,label:"Infrastructure"}
];
function buildCatRail(){
  var rail=document.getElementById("cat-rail");
  rail.innerHTML="";
  CATS.forEach(function(c){
    var hasBuildings=c.cat==="all"||BATIMENTS.some(function(b){return b.categorie===c.cat;});
    if(!hasBuildings)return;
    var btn=document.createElement("button");
    btn.className="cr-btn"+(S.filter===c.cat?" on":"");
    btn.dataset.cat=c.cat;
    btn.title=c.label;
    var co=c.cat==="all"?"#5B7FFF":catColor(c.cat);
    if(c.cat!=="all"){
      var dot=document.createElement("div");dot.className="cr-dot";dot.style.background=co;
      btn.appendChild(dot);
    }
    btn.innerHTML+=c.icon.replace("<svg","<svg style='width:17px;height:17px;'");
    if(c.cat!=="all"&&S.filter===c.cat){btn.style.borderColor=rgba(co,.5);}
    btn.onclick=function(){setFilter(c.cat);};
    rail.appendChild(btn);
  });
}

function setFilter(cat){
  S.filter=cat;
  document.querySelectorAll(".cr-btn").forEach(function(b){
    b.classList.toggle("on",b.dataset.cat===cat);
    if(b.dataset.cat!=="all"&&b.dataset.cat===cat){var co=catColor(cat);b.style.borderColor=rgba(co,.5);}
    else b.style.borderColor="";
  });
  updateMarkers();buildCarousel();buildDpList();
  var f=getFiltered();
  document.querySelectorAll(".dpf").forEach(function(p){p.classList.toggle("on",p.dataset.cat===cat);});
}

/* FILTERED BUILDINGS */
function getFiltered(){
  var out=BATIMENTS.filter(function(b){return S.filter==="all"||b.categorie===S.filter;});
  if(S.lat!==null)out.sort(function(a,b){return hav(S.lat,S.lng,a.lat,a.lng)-hav(S.lat,S.lng,b.lat,b.lng);});
  return out;
}

/* CAROUSEL */
function buildCarousel(){
  var c=document.getElementById("carousel"),f=getFiltered();
  c.innerHTML="";
  f.forEach(function(b,i){
    var co=catColor(b.categorie);
    var dist=S.lat!==null?fd(hav(S.lat,S.lng,b.lat,b.lng)):"";
    var div=document.createElement("div");
    div.className="c-card"+(S.cur&&S.cur.id===b.id?" sel":"");
    div.style.animationDelay=(i*0.04)+"s";
    div.innerHTML=
      '<div class="cc-top">'+
        '<div class="cc-dot" style="background:'+co+';box-shadow:0 0 0 3px '+rgba(co,.2)+'"></div>'+
        (dist?'<div class="cc-dist">'+dist+'</div>':'')+
      '</div>'+
      '<div class="cc-nm">'+b.nom+'</div>'+
      '<div class="cc-bot">'+
        '<div class="cc-cat">'+catLabel(b.categorie)+'</div>'+
        '<div class="cc-arr">'+IC.chv+'</div>'+
      '</div>';
    div.onclick=function(){openDetail(b.id,false);};
    c.appendChild(div);
  });
}

/* DETAIL INFO */
function infoHTML(b){
  function row(lbl,val){if(skip(val))return"";return'<div class="ir"><div class="il">'+lbl+'</div><div class="iv">'+val+'</div></div>';}
  var eq=[];
  if(b.wifi&&b.wifi!=="Non")eq.push(b.wifi==="Oui"?"Wi-Fi":"Wi-Fi ("+b.wifi+")");
  if(b.telephone==="Oui")eq.push("Téléphone");
  if(b.videoprojecteur&&b.videoprojecteur!=="Non")eq.push(b.videoprojecteur==="Oui"?"Vidéoprojecteur":b.videoprojecteur);
  if(b.sonorisation&&b.sonorisation!=="Non")eq.push(b.sonorisation==="Oui"?"Sonorisation":"Sono "+b.sonorisation);
  if(b.cuisine==="Oui")eq.push("Cuisine");if(b.chauffage==="Oui")eq.push("Chauffage");if(b.climatisation==="Oui")eq.push("Climatisation");
  var eqRow=eq.length?'<div class="ir"><div class="il">Équipements</div><div class="chips">'+eq.map(function(e){return'<span class="chip">'+e+'</span>';}).join("")+'</div></div>':"";
  var acc=[];
  if(!skip(b.pmr))acc.push("PMR : "+b.pmr);
  if(!skip(b.ascenseur))acc.push("Ascenseur : "+b.ascenseur);
  if(!skip(b.parking))acc.push("Parking : "+b.parking);
  if(!skip(b.transports))acc.push("Transports : "+b.transports);
  var accRow=acc.length?'<div class="ir"><div class="il">Accessibilité</div><div class="iv">'+acc.join(" · ")+'</div></div>':"";
  var etatRow="";
  if(!skip(b.etat)){var cls=b.etat==="RAS"||b.etat==="Bon état"?"e-ok":b.etat==="Moyen"?"e-mid":"e-bad";etatRow='<div class="ir"><div class="il">État général</div><div class="iv"><span class="ebadge '+cls+'">'+b.etat+'</span></div></div>';}
  var trRow="";
  if(!skip(b.travaux_recents)&&b.travaux_recents!=="Aucun"&&b.travaux_recents!=="RAS")trRow+='<div class="ir"><div class="il">Travaux récents</div><div class="iv">'+b.travaux_recents+'</div></div>';
  if(!skip(b.travaux_a_prevoir)&&b.travaux_a_prevoir!=="Aucun"&&b.travaux_a_prevoir!=="RAS"){var tc=b.travaux_a_prevoir==="En totalité"?"tw-bad":"tw-mid";trRow+='<div class="ir"><div class="il">Travaux à prévoir</div><div class="iv '+tc+'">'+b.travaux_a_prevoir+'</div></div>';}
  var s1='<div class="ig">'+row("Adresse",b.adresse)+(b.capacite&&b.capacite!=="0 personne"?row("Capacité",b.capacite):"")+row("Activités",b.activites)+row("Jours d\'utilisation",b.jours)+row("Associations",b.associations)+row("Événements",b.evenements)+'</div>';
  var s2=(accRow||eqRow)?'<div class="ig">'+accRow+eqRow+'</div>':"";
  var s3=(etatRow||trRow)?'<div class="ig">'+etatRow+trRow+'</div>':"";
  return s1+s2+s3;
}

/* OPEN DETAIL */
function openDetail(id, fromMarker){
  var b=null,idx=0;
  var f=getFiltered();
  for(var i=0;i<f.length;i++){if(f[i].id===id){b=f[i];idx=i;break;}}
  if(!b){b=null;BATIMENTS.forEach(function(x,i){if(x.id===id)b=x;});if(!b)return;idx=0;}
  S.cur=b;S.curIdx=idx;
  hlMarker(id);
  if(b.lat&&b.lng&&S.map)S.map.flyTo({center:[b.lng,b.lat],zoom:15.2,duration:700});

  /* Update carousel selection */
  document.querySelectorAll(".c-card").forEach(function(c,i){c.classList.toggle("sel",i===idx);});

  /* Fill detail */
  var co=catColor(b.categorie);
  document.getElementById("det-name").textContent=b.nom;
  document.getElementById("det-cat-dot").style.background=co;
  document.getElementById("det-cat-dot").style.boxShadow="0 0 0 3px "+rgba(co,.2);
  document.getElementById("det-cat-label").textContent=catLabel(b.categorie).toUpperCase();
  applyPhoto(document.getElementById("det-ph-empty"),document.getElementById("det-ph-ld"),document.getElementById("det-ph-img"),b);
  document.getElementById("det-info").innerHTML=infoHTML(b);
  document.getElementById("det-ar").onclick=function(){window.location.href="ar.html?id="+b.id;};

  /* Show detail */
  document.getElementById("detail").classList.add("on");
}

/* NAVIGATE PREV/NEXT in detail */
function detNavOffset(dir){
  var f=getFiltered();
  var newIdx=(S.curIdx+dir+f.length)%f.length;
  openDetail(f[newIdx].id,false);
}
document.getElementById("det-prev").onclick=function(){detNavOffset(-1);};
document.getElementById("det-next").onclick=function(){detNavOffset(1);};

/* CLOSE DETAIL */
document.getElementById("det-close").onclick=function(){
  document.getElementById("detail").classList.remove("on");
  S.cur=null;hlMarker(null);
  document.querySelectorAll(".c-card").forEach(function(c){c.classList.remove("sel");});
};

/* GEOLOCATION */
document.getElementById("btn-locate").onclick=function(){
  if(!navigator.geolocation){toast("Géolocalisation non disponible");return;}
  var btn=this;btn.classList.add("on");
  navigator.geolocation.getCurrentPosition(function(p){
    S.lat=p.coords.latitude;S.lng=p.coords.longitude;
    if(S.uMk)S.uMk.remove();
    var el=document.createElement("div");
    el.style.cssText="width:14px;height:14px;border-radius:50%;background:#5B7FFF;border:3px solid #fff;box-shadow:0 2px 8px rgba(91,127,255,.5);";
    S.uMk=new maptilersdk.Marker({element:el}).setLngLat([S.lng,S.lat]).addTo(S.map);
    S.map.flyTo({center:[S.lng,S.lat],zoom:15,duration:800});
    var lb=document.getElementById("loc-badge");lb.classList.add("on");
    setTimeout(function(){lb.classList.remove("on");},3000);
    buildCarousel();buildDpList();
  },function(){btn.classList.remove("on");toast("Position indisponible");},{enableHighAccuracy:true,timeout:8000});
};

/* DESKTOP PANEL */
function buildDpFilt(){
  var df=document.getElementById("dp-filt");if(!df)return;
  var h='<button class="dpf on" data-cat="all" onclick="setFilter(\'all\')">Tous</button>';
  Object.keys(CATEGORIES).forEach(function(cat){
    var n=BATIMENTS.filter(function(b){return b.categorie===cat;}).length;if(!n)return;
    var co=catColor(cat);
    h+='<button class="dpf" data-cat="'+cat+'" onclick="setFilter(\''+cat+'\')" ><span class="dfd" style="background:'+co+'"></span>'+catLabel(cat)+'</button>';
  });
  df.innerHTML=h;
}
function buildDpList(){
  var dl=document.getElementById("dp-list");if(!dl)return;
  var f=getFiltered();
  dl.innerHTML=f.map(function(b){
    var co=catColor(b.categorie);
    var dist=S.lat!==null?'<div class="dp-dist">'+fd(hav(S.lat,S.lng,b.lat,b.lng))+'</div>':"";
    var cap=b.capacite&&b.capacite!=="0 personne"?b.capacite:null;
    return '<div class="dp-row" onclick="openDetail(\''+b.id+'\',false)">'+
      '<div class="dp-dot" style="background:'+co+'"></div>'+
      '<div class="dp-body"><div class="dp-nm">'+b.nom+'</div><div class="dp-meta">'+catLabel(b.categorie)+(cap?" · "+cap:"")+'</div></div>'+
      dist+'<div class="dp-chev">'+IC.chv+'</div>'+
    '</div>';
  }).join("");
}

/* ADMIN PHOTO MANAGEMENT */
function openAdmModal(){document.getElementById("adm-modal").classList.add("on");setTimeout(function(){document.getElementById("adm-pwd").focus();},80);}
function closeAdmModal(){document.getElementById("adm-modal").classList.remove("on");document.getElementById("adm-pwd").value="";document.getElementById("adm-err").textContent="";}

async function hashP(p){var e=new TextEncoder(),b=await crypto.subtle.digest("SHA-256",e.encode(p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}
async function submitAdm(){
  var p=document.getElementById("adm-pwd").value;if(!p)return;
  var h=await hashP(p);
  if(h===ADMIN_HASH){S.isAdm=true;document.body.classList.add("adm");document.getElementById("adm-glow").style.display="flex";closeAdmModal();openAdminPanel();}
  else{document.getElementById("adm-err").textContent="Mot de passe incorrect.";document.getElementById("adm-pwd").value="";}
}
document.getElementById("adm-pwd").addEventListener("keydown",function(e){if(e.key==="Enter")submitAdm();});
document.getElementById("adm-modal").addEventListener("click",function(e){if(e.target===this)closeAdmModal();});

function openAdminPanel(){buildAdmGrid();document.getElementById("admin-panel").classList.add("on");}
function closeAdminPanel(){document.getElementById("admin-panel").classList.remove("on");showAdmGrid();}
document.getElementById("adm-close-btn").onclick=closeAdminPanel;

function buildAdmGrid(){
  var g=document.getElementById("adm-grid");
  g.innerHTML=BATIMENTS.map(function(b){
    var photo=getPhoto(b);
    var co=catColor(b.categorie);
    return '<div class="ag-item" onclick="openPhotoManager(\''+b.id+'\')">'+
      '<div class="ag-photo">'+
        (photo?'<img src="'+photo+'" alt=""><div class="ag-has-badge"></div>':'<div class="ag-ph-ico">'+IC.bld.replace("<svg","<svg style='width:24px;height:24px;stroke:rgba(255,255,255,.4)'")+'</div>')+
      '</div>'+
      '<div class="ag-info">'+
        '<div class="ag-nm">'+b.nom+'</div>'+
        '<div class="ag-cat" style="color:'+rgba(co,.8)+'" >'+catLabel(b.categorie)+'</div>'+
      '</div>'+
    '</div>';
  }).join("");
}
function showAdmGrid(){document.getElementById("adm-grid").style.display="grid";document.getElementById("pm").classList.remove("on");document.getElementById("adm-title").textContent="Gestion des photos";}

function openPhotoManager(id){
  var b=null;BATIMENTS.forEach(function(x){if(x.id===id)b=x;});if(!b)return;
  S.pmBuilding=b;S.pmPending=null;
  document.getElementById("adm-grid").style.display="none";
  document.getElementById("adm-title").textContent="Photo · "+b.nom;
  document.getElementById("pm").classList.add("on");
  document.getElementById("pm-bldg").textContent=b.nom;
  document.getElementById("pm-cat").textContent=catLabel(b.categorie);
  refreshPmCurrentPhoto();
  document.getElementById("pm-preview-box").classList.remove("on");
  document.getElementById("pm-save-row").style.display="none";
  var delRow=document.getElementById("pm-del-row");
  delRow.style.display=getPhoto(b)?"flex":"none";
  document.getElementById("pm").scrollTop=0;
}
document.getElementById("pm-back").onclick=function(){showAdmGrid();buildAdmGrid();};

function refreshPmCurrentPhoto(){
  var b=S.pmBuilding,d=getPhoto(b);
  var img=document.getElementById("pm-cur-img");
  var ico=document.getElementById("pm-cur-ico");
  if(d){img.src=d;img.style.display="block";ico.style.display="none";}
  else{img.style.display="none";ico.style.display="flex";}
}

/* Upload button */
document.getElementById("pm-upload-btn").onclick=function(){document.getElementById("pm-file-in").click();};
document.getElementById("pm-file-in").addEventListener("change",function(e){
  var file=e.target.files[0];if(!file)return;
  this.value="";
  compressImage(file,function(compressed,origSize,compSize){
    S.pmPending=compressed;
    document.getElementById("pm-preview-img").src=compressed;
    document.getElementById("pm-before").textContent=fmtBytes(origSize);
    document.getElementById("pm-after").textContent=fmtBytes(compSize);
    document.getElementById("pm-preview-box").classList.add("on");
    document.getElementById("pm-save-row").style.display="flex";
  });
});

/* Save new photo */
document.getElementById("pm-save-btn").onclick=function(){
  if(!S.pmPending||!S.pmBuilding)return;
  savePhoto(S.pmBuilding.id,S.pmPending);
  S.pmPending=null;
  document.getElementById("pm-preview-box").classList.remove("on");
  document.getElementById("pm-save-row").style.display="none";
  document.getElementById("pm-del-row").style.display="flex";
  refreshPmCurrentPhoto();
  /* Refresh detail if same building open */
  if(S.cur&&S.cur.id===S.pmBuilding.id){applyPhoto(document.getElementById("det-ph-empty"),document.getElementById("det-ph-ld"),document.getElementById("det-ph-img"),S.pmBuilding);}
};

/* Cancel preview */
document.getElementById("pm-cancel-btn").onclick=function(){
  S.pmPending=null;
  document.getElementById("pm-preview-box").classList.remove("on");
  document.getElementById("pm-save-row").style.display="none";
};

/* Delete photo */
document.getElementById("pm-delete-btn").onclick=function(){
  if(!S.pmBuilding)return;
  if(!confirm("Supprimer la photo de "+S.pmBuilding.nom+" ?"))return;
  deletePhoto(S.pmBuilding.id);
  refreshPmCurrentPhoto();
  document.getElementById("pm-del-row").style.display="none";
  if(S.cur&&S.cur.id===S.pmBuilding.id){applyPhoto(document.getElementById("det-ph-empty"),document.getElementById("det-ph-ld"),document.getElementById("det-ph-img"),S.pmBuilding);}
  buildAdmGrid();
};

/* Long-press on city title → admin */
var cityT=document.getElementById("city-title");
cityT.addEventListener("touchstart",function(){S.pt=setTimeout(function(){S.isAdm?openAdminPanel():openAdmModal();},1500);});
cityT.addEventListener("touchend",function(){clearTimeout(S.pt);});
/* Click also works for desktop (hidden from view) */
cityT.addEventListener("dblclick",function(){S.isAdm?openAdminPanel():openAdmModal();});

/* Logout */
function logout(){S.isAdm=false;document.body.classList.remove("adm");document.getElementById("adm-glow").style.display="none";closeAdminPanel();toast("Session admin terminée");}

window.openDetail=openDetail;window.setFilter=setFilter;
window.submitAdm=submitAdm;window.closeAdmModal=closeAdmModal;
window.openPhotoManager=openPhotoManager;window.logout=logout;
window.openAdmModal=openAdmModal;window.openAdminPanel=openAdminPanel;

/* INIT */
loadPhotos();
buildCatRail();
buildCarousel();
buildDpFilt();
buildDpList();
initMap();
</script>
</body>
</html>
