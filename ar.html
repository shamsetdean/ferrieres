<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vue AR — Ferrières-en-Brie</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="./data.js"></script>
<style>
:root{
  --f:'Manrope',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
  --gold:#C8963A;--gold2:#F0C866;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--f);-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}

/* CAMERA */
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
#vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.25) 100%),
    linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 18%,transparent 72%,rgba(0,0,0,.55) 100%);
}

/* AR MARKERS OVERLAY */
#ar-overlay{position:fixed;inset:0;z-index:10;pointer-events:none;}
.ar-marker{
  position:absolute;transform:translate(-50%,-100%);
  pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  transition:opacity .25s;
  animation:markerIn .3s var(--ease) both;
}
@keyframes markerIn{from{opacity:0;transform:translate(-50%,-100%) translateY(10px);}to{transform:translate(-50%,-100%);}}
.ar-bubble{
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;
  padding:9px 13px 11px;min-width:130px;max-width:175px;
  box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.65);
}
.ar-cat{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(23,23,25,.55);margin-bottom:3px;display:flex;align-items:center;gap:5px;}
.ar-dot{width:6px;height:6px;border-radius:50%;background:var(--c,#C8963A);}
.ar-name{font-size:13px;font-weight:700;color:#171719;line-height:1.2;}
.ar-dist{font-size:11px;font-weight:600;color:var(--gold);margin-top:3px;display:flex;align-items:center;gap:4px;}
.ar-dist i{font-size:12px;}
.ar-stem{width:1.5px;height:16px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.95));margin:0 auto;border-radius:1px;}
.ar-tip{width:9px;height:9px;border-radius:50%;background:#fff;margin:0 auto;box-shadow:0 0 8px rgba(255,255,255,.7),0 0 0 2px rgba(255,255,255,.35);}
.ar-tip::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);animation:tipP 2s ease-out infinite;}
@keyframes tipP{0%{transform:scale(1);opacity:.6;}80%{transform:scale(2.2);opacity:0;}100%{transform:scale(2.2);opacity:0;}}

/* ── GRANDE FLÈCHE DIRECTIONNELLE ─────────────────────
   Affichée au centre-bas quand un bâtiment est ciblé.
   Tourne pour pointer vers le bâtiment.
─────────────────────────────────────────────────────── */
#dir-arrow{
  position:fixed;
  bottom:calc(140px + var(--sab));
  left:50%;transform:translateX(-50%) rotate(0deg);
  z-index:40;
  width:80px;height:80px;
  display:none;flex-direction:column;align-items:center;
  transition:transform .3s var(--ease);
  transform-origin:center 60%;
  filter:
    drop-shadow(0 0 18px rgba(200,150,58,.85))
    drop-shadow(0 0 6px rgba(200,150,58,.5))
    drop-shadow(0 2px 8px rgba(0,0,0,.4));
}
#dir-arrow.visible{display:flex;}
#dir-arrow svg{display:block;}

/* Badge distance + nom sous la flèche */
#dir-badge{
  position:fixed;
  bottom:calc(68px + var(--sab));
  left:50%;transform:translateX(-50%);
  z-index:40;
  display:none;flex-direction:column;align-items:center;gap:5px;
  pointer-events:none;
}
#dir-badge.visible{display:flex;}
#dir-dist{
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);
  padding:5px 16px;border-radius:99px;
  font-size:16px;font-weight:800;color:#fff;
  font-feature-settings:"tnum";
  letter-spacing:.5px;
}
#dir-name{
  font-size:11px;font-weight:600;color:rgba(255,255,255,.75);
  letter-spacing:.5px;text-align:center;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  max-width:220px;
}

/* ── ARRIVED INDICATOR ── */
#arrived{
  position:fixed;inset:0;z-index:60;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#arrived.show{display:flex;}
#arrived-card{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;padding:32px 28px;text-align:center;
  max-width:300px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
#arrived-card i{font-size:44px;color:#3F7D58;display:block;margin-bottom:12px;}
#arrived-card h3{font-size:20px;font-weight:800;color:#171719;margin-bottom:6px;}
#arrived-card p{font-size:14px;color:rgba(23,23,25,.6);margin-bottom:20px;}
#arrived-card button{width:100%;height:48px;background:#171719;color:#fff;border-radius:99px;font-size:14px;font-weight:700;}

/* HEADER */
#ar-header{
  position:fixed;top:0;left:0;right:0;
  padding:calc(14px + var(--sat)) 16px 14px;
  display:flex;align-items:center;gap:12px;
  z-index:50;pointer-events:auto;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%);
}
#btn-back{
  width:44px;height:44px;border-radius:99px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;flex-shrink:0;
  transition:transform .12s;
}
#btn-back:active{transform:scale(.9);}
#ar-title{font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);}
#ar-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.7);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.4);}

/* STATUS DOTS */
#ar-status{
  position:fixed;bottom:calc(16px + var(--sab));left:50%;transform:translateX(-50%);
  z-index:50;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.22);
  border-radius:99px;padding:8px 16px;
  display:flex;align-items:center;gap:10px;
  pointer-events:none;
}
#ar-status-text{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;}
.sdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);}
.sdot.ok{background:#3F7D58;box-shadow:0 0 5px rgba(63,125,88,.6);}
.sdot.pending{background:#C8963A;animation:sdP 1.2s ease-in-out infinite;}
.sdot.err{background:#C0392B;}
@keyframes sdP{0%,100%{opacity:1;}50%{opacity:.35;}}

/* DETAIL SHEET */
#ar-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:55;
  background:rgba(255,255,255,.88);
  backdrop-filter:saturate(160%) blur(28px);-webkit-backdrop-filter:saturate(160%) blur(28px);
  border-top:1px solid rgba(255,255,255,.7);
  border-radius:24px 24px 0 0;
  transform:translateY(100%);opacity:0;
  transition:transform .4s var(--ease),opacity .22s;
  padding:0 0 var(--sab);
  max-height:70vh;overflow-y:auto;
  box-shadow:0 -20px 60px rgba(0,0,0,.2);
}
#ar-sheet.open{transform:translateY(0);opacity:1;}
#ar-sheet::-webkit-scrollbar{display:none;}
.sheet-handle{padding:10px 0 4px;display:flex;justify-content:center;}
.sheet-bar{width:40px;height:4px;background:rgba(23,23,25,.14);border-radius:99px;}
#ar-sheet-body{padding:12px 20px 22px;}
.sheet-cat{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(23,23,25,.45);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.sheet-cdot{width:7px;height:7px;border-radius:50%;background:var(--c,#C8963A);}
.sheet-name{font-size:22px;font-weight:800;color:#171719;line-height:1.15;margin-bottom:8px;}
.sheet-meta{display:flex;gap:14px;margin-bottom:12px;font-size:13px;color:rgba(23,23,25,.55);}
.sheet-meta span{display:flex;align-items:center;gap:5px;}
.sheet-meta i{font-size:14px;color:var(--gold);}
.sheet-desc{font-size:14px;line-height:1.6;color:rgba(23,23,25,.65);margin-bottom:18px;}
.sheet-btns{display:flex;gap:10px;}
.sbtn{flex:1;height:50px;border-radius:99px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;}
.sbtn:active{transform:scale(.97);}
.sbtn.primary{background:#171719;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.sbtn.secondary{background:rgba(23,23,25,.07);color:#171719;border:1px solid rgba(23,23,25,.12);}
.sbtn i{font-size:17px;}

/* PERMISSION SCREEN */
#perm{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(160deg,#FFFFFF,#F4F4F6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 28px;text-align:center;
}
#perm.hidden{display:none;}
.perm-ico{
  width:80px;height:80px;border-radius:22px;
  background:rgba(200,150,58,.1);border:1px solid rgba(200,150,58,.2);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:24px;color:var(--gold);font-size:34px;
  box-shadow:0 10px 30px rgba(200,150,58,.15);
}
.perm-title{font-size:28px;font-weight:800;color:#171719;margin-bottom:10px;}
.perm-sub{font-size:14px;line-height:1.6;color:rgba(23,23,25,.55);margin-bottom:28px;max-width:320px;}
.perm-items{display:flex;flex-direction:column;gap:9px;margin-bottom:28px;width:100%;max-width:310px;}
.perm-item{
  display:flex;align-items:center;gap:13px;
  padding:13px 15px;background:#fff;border:1px solid rgba(23,23,25,.09);
  border-radius:14px;text-align:left;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.perm-item i{font-size:21px;color:var(--gold);flex-shrink:0;}
.pi-t{font-size:13px;font-weight:700;color:#171719;}
.pi-s{font-size:11px;color:rgba(23,23,25,.45);margin-top:1px;}
#btn-start{
  width:100%;max-width:310px;height:54px;
  background:#171719;color:#fff;border-radius:99px;
  font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:transform .12s;
}
#btn-start:active{transform:scale(.97);}
#btn-start i{font-size:17px;}
</style>
</head>
<body>

<div id="perm">
  <div class="perm-ico"><i class="ti ti-augmented-reality" aria-hidden="true"></i></div>
  <div class="perm-title">Vue AR</div>
  <p class="perm-sub">Pointez votre appareil vers les bâtiments. La flèche vous guide vers votre destination.</p>
  <div class="perm-items">
    <div class="perm-item"><i class="ti ti-camera" aria-hidden="true"></i><div><div class="pi-t">Caméra</div><div class="pi-s">Flux vidéo en arrière-plan</div></div></div>
    <div class="perm-item"><i class="ti ti-current-location" aria-hidden="true"></i><div><div class="pi-t">Localisation</div><div class="pi-s">Distance et direction</div></div></div>
    <div class="perm-item"><i class="ti ti-compass" aria-hidden="true"></i><div><div class="pi-t">Orientation</div><div class="pi-s">Cap et direction visée</div></div></div>
  </div>
  <button id="btn-start"><i class="ti ti-camera" aria-hidden="true"></i>Activer la vue AR</button>
</div>

<video id="camera" autoplay playsinline muted></video>
<div id="vignette"></div>
<div id="ar-overlay"></div>

<!-- GRANDE FLÈCHE DIRECTIONNELLE -->
<div id="dir-arrow">
  <svg width="68" height="88" viewBox="0 0 68 88" fill="none">
    <defs>
      <linearGradient id="ag" x1="34" y1="0" x2="34" y2="88" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F0C866"/>
        <stop offset="50%" stop-color="#C8963A"/>
        <stop offset="100%" stop-color="#9A6E20"/>
      </linearGradient>
      <linearGradient id="aspec" x1="14" y1="4" x2="38" y2="50" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="rgba(255,255,255,0.50)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </linearGradient>
    </defs>
    <!-- Ombre -->
    <path d="M34 6 L62 52 L34 42 L6 52 Z" fill="rgba(0,0,0,0.22)" transform="translate(0,4)"/>
    <!-- Corps -->
    <path d="M34 4 L62 50 L34 40 L6 50 Z" fill="url(#ag)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Queue arrondie -->
    <rect x="28" y="40" width="12" height="42" rx="5" fill="url(#ag)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <!-- Reflet spéculaire -->
    <path d="M34 6 L56 44 L34 36" fill="url(#aspec)"/>
  </svg>
</div>

<div id="dir-badge">
  <div id="dir-dist">— m</div>
  <div id="dir-name">—</div>
</div>

<!-- ARRIVED -->
<div id="arrived">
  <div id="arrived-card">
    <i class="ti ti-circle-check" aria-hidden="true"></i>
    <h3>Vous êtes arrivé !</h3>
    <p id="arrived-name">—</p>
    <button onclick="dismissArrived()">Continuer l'exploration</button>
  </div>
</div>

<div id="ar-header">
  <button id="btn-back" onclick="goBack()"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
  <div>
    <div id="ar-title">Vue augmentée</div>
    <div id="ar-sub">Pointez vers les bâtiments</div>
  </div>
</div>

<div id="ar-status">
  <div class="sdot" id="sd-cam"></div>
  <div class="sdot" id="sd-gps"></div>
  <div class="sdot" id="sd-ori"></div>
  <div id="ar-status-text">Initialisation…</div>
</div>

<div id="ar-sheet">
  <div class="sheet-handle"><div class="sheet-bar"></div></div>
  <div id="ar-sheet-body">
    <div class="sheet-cat"><span class="sheet-cdot"></span><span id="scat">—</span></div>
    <div class="sheet-name" id="sname">—</div>
    <div class="sheet-meta">
      <span><i class="ti ti-route" aria-hidden="true"></i><span id="sdist">—</span></span>
      <span><i class="ti ti-compass" aria-hidden="true"></i><span id="sbear">—</span></span>
    </div>
    <div class="sheet-desc" id="sdesc">—</div>
    <div class="sheet-btns">
      <button class="sbtn secondary" onclick="closeSheet()"><i class="ti ti-x" aria-hidden="true"></i>Fermer</button>
      <button class="sbtn primary" id="btn-nav"><i class="ti ti-navigation" aria-hidden="true"></i>Naviguer</button>
    </div>
  </div>
</div>

<script>
var AR={stream:null,heading:0,lat:null,lng:null,watchId:null,target:null,orientOk:false,gpsOk:false,camOk:false,fov:65,arrived:false};

/* ── UTILS ── */
function hav(a,b,c,d){var R=6371000,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)*Math.sin(dn/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bearing(a,b,c,d){var dn=(d-b)*Math.PI/180,y=Math.sin(dn)*Math.cos(c*Math.PI/180),x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dn);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function fmDist(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km";}
function bearLabel(b){return["N","NE","E","SE","S","SO","O","NO"][Math.round(b/45)%8];}
function sdot(id,s){var e=document.getElementById("sd-"+id);if(e)e.className="sdot "+s;}
function updateStatus(){
  var ok=AR.camOk&&AR.gpsOk&&AR.orientOk;
  var msgs=[];
  if(!AR.camOk)msgs.push("Caméra");if(!AR.gpsOk)msgs.push("GPS");if(!AR.orientOk)msgs.push("Boussole");
  document.getElementById("ar-status-text").textContent=ok?(AR.target?"Guidage actif · "+AR.target.nom:"AR actif · "+BATIMENTS.length+" bâtiments"):"En attente : "+msgs.join(" · ");
}

/* ── CAMÉRA ── */
function startCam(){
  sdot("cam","pending");
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}})
    .then(function(s){AR.stream=s;document.getElementById("camera").srcObject=s;AR.camOk=true;sdot("cam","ok");updateStatus();})
    .catch(function(){sdot("cam","err");});
}

/* ── GPS ── */
function startGPS(){
  if(!navigator.geolocation){sdot("gps","err");return;}
  sdot("gps","pending");
  AR.watchId=navigator.geolocation.watchPosition(
    function(p){AR.lat=p.coords.latitude;AR.lng=p.coords.longitude;AR.gpsOk=true;sdot("gps","ok");updateStatus();updateArrow();renderMarkers();},
    function(){sdot("gps","err");},
    {enableHighAccuracy:true,maximumAge:1000,timeout:10000}
  );
}

/* ── ORIENTATION ── */
function startOrientation(){
  sdot("ori","pending");
  function onOri(e){
    var h=e.webkitCompassHeading||(e.alpha!=null?(360-e.alpha):0);
    AR.heading=h;AR.orientOk=true;sdot("ori","ok");
    updateArrow();renderMarkers();updateStatus();
  }
  if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(function(p){
      if(p==="granted")window.addEventListener("deviceorientationabsolute",onOri,true)||window.addEventListener("deviceorientation",onOri,true);
      else sdot("ori","err");
    }).catch(function(){sdot("ori","err");});
  } else {
    var ok=false;
    window.addEventListener("deviceorientationabsolute",function(e){ok=true;onOri(e);},true);
    setTimeout(function(){if(!ok)window.addEventListener("deviceorientation",onOri,true);},500);
  }
}

/* ── GRANDE FLÈCHE ── */
function updateArrow(){
  if(!AR.target||!AR.gpsOk){return;}
  var dist=hav(AR.lat,AR.lng,AR.target.lat,AR.target.lng);
  var bear=bearing(AR.lat,AR.lng,AR.target.lat,AR.target.lng);

  /* Angle relatif : cap du bâtiment - orientation de l'appareil */
  var rel=bear-AR.heading;

  document.getElementById("dir-dist").textContent=fmDist(dist);
  document.getElementById("dir-name").textContent=AR.target.nom;

  var arrow=document.getElementById("dir-arrow");
  var badge=document.getElementById("dir-badge");
  arrow.classList.add("visible");
  badge.classList.add("visible");

  /* La flèche pointe → on applique la rotation totale :
     translateX(-50%) d'abord, puis rotate autour du centre-bas */
  arrow.style.transform="translateX(-50%) rotate("+rel+"deg)";

  /* Arrivée < 15m */
  if(dist<15&&!AR.arrived){
    AR.arrived=true;
    document.getElementById("arrived-name").textContent=AR.target.nom;
    document.getElementById("arrived").classList.add("show");
    arrow.classList.remove("visible");
    badge.classList.remove("visible");
  }
}

/* ── AR MARKERS ── */
function renderMarkers(){
  if(!AR.gpsOk||!AR.orientOk)return;
  var overlay=document.getElementById("ar-overlay");
  overlay.innerHTML="";
  var vw=window.innerWidth,vh=window.innerHeight,half=AR.fov/2;
  BATIMENTS.forEach(function(b){
    if(!b.lat||!b.lng)return;
    var dist=hav(AR.lat,AR.lng,b.lat,b.lng);
    if(dist>1200)return;
    var bear=bearing(AR.lat,AR.lng,b.lat,b.lng);
    var diff=bear-AR.heading;
    while(diff>180)diff-=360;while(diff<-180)diff+=360;
    if(Math.abs(diff)>half+8)return;
    var x=vw/2+(diff/half)*(vw/2);
    var y=vh*0.28+(Math.min(dist/350,1))*vh*0.32;
    var col=(CATEGORIES[b.categorie]&&CATEGORIES[b.categorie].color)||"#C8963A";
    var lbl=(CATEGORIES[b.categorie]&&CATEGORIES[b.categorie].label)||b.categorie;
    var op=Math.max(0.5,1-dist/1200);
    var el=document.createElement("div");
    el.className="ar-marker";
    el.style.cssText="left:"+x+"px;top:"+y+"px;opacity:"+op+";";
    el.style.setProperty("--c",col);
    el.innerHTML=
      '<div class="ar-bubble">'+
        '<div class="ar-cat"><span class="ar-dot"></span>'+lbl+'</div>'+
        '<div class="ar-name">'+b.nom+'</div>'+
        '<div class="ar-dist"><i class="ti ti-route" aria-hidden="true"></i>'+fmDist(dist)+'</div>'+
      '</div>'+
      '<div class="ar-stem"></div>'+
      '<div style="position:relative"><div class="ar-tip"></div></div>';
    (function(bld,d,br){el.addEventListener("click",function(){openSheet(bld,d,br);});})(b,dist,bear);
    overlay.appendChild(el);
  });
}

/* ── SHEET ── */
function openSheet(b,dist,bear){
  var col=(CATEGORIES[b.categorie]&&CATEGORIES[b.categorie].color)||"#C8963A";
  document.getElementById("ar-sheet").style.setProperty("--c",col);
  document.querySelector(".sheet-cdot").style.background=col;
  document.getElementById("scat").textContent=(CATEGORIES[b.categorie]&&CATEGORIES[b.categorie].label)||b.categorie;
  document.getElementById("sname").textContent=b.nom;
  document.getElementById("sdist").textContent=fmDist(dist);
  document.getElementById("sbear").textContent=bearLabel(bear);
  document.getElementById("sdesc").textContent=b.description||"Bâtiment public communal.";
  document.getElementById("btn-nav").onclick=function(){
    AR.target=b;AR.arrived=false;
    document.getElementById("ar-title").textContent=b.nom;
    document.getElementById("ar-sub").textContent="Suivez la flèche";
    updateArrow();closeSheet();updateStatus();
  };
  document.getElementById("ar-sheet").classList.add("open");
}
function closeSheet(){document.getElementById("ar-sheet").classList.remove("open");}
function dismissArrived(){
  document.getElementById("arrived").classList.remove("show");
  AR.target=null;
  document.getElementById("dir-arrow").classList.remove("visible");
  document.getElementById("dir-badge").classList.remove("visible");
  document.getElementById("ar-title").textContent="Vue augmentée";
  document.getElementById("ar-sub").textContent="Pointez vers les bâtiments";
  updateStatus();
}
function goBack(){if(AR.stream)AR.stream.getTracks().forEach(function(t){t.stop();});window.history.back();}

/* ── INIT ── */
document.getElementById("btn-start").onclick=function(){
  document.getElementById("perm").classList.add("hidden");
  startCam();startGPS();startOrientation();updateStatus();
  setInterval(function(){if(AR.gpsOk&&AR.orientOk){renderMarkers();if(AR.target)updateArrow();}},250);
};

/* Auto-démarrer si ?id= est dans l'URL */
window.addEventListener("load",function(){
  var params=new URLSearchParams(window.location.search);
  var targetId=params.get("id");
  if(targetId){
    /* Lancer directement sans écran de permission (demander quand même les perms) */
    document.getElementById("btn-start").textContent="";
    document.getElementById("btn-start").innerHTML='<i class="ti ti-camera" aria-hidden="true"></i>Naviguer vers '+
      ((BATIMENTS.find(function(b){return b.id===targetId;})||{nom:"ce lieu"}).nom);
    document.getElementById("btn-start").onclick=function(){
      document.getElementById("perm").classList.add("hidden");
      startCam();startGPS();startOrientation();updateStatus();
      setInterval(function(){if(AR.gpsOk&&AR.orientOk){renderMarkers();if(AR.target)updateArrow();}},250);
      /* Activer le guidage dès que le GPS est prêt */
      var checkGps=setInterval(function(){
        if(AR.gpsOk){
          clearInterval(checkGps);
          var b=BATIMENTS.find(function(x){return x.id===targetId;});
          if(b){AR.target=b;AR.arrived=false;document.getElementById("ar-title").textContent=b.nom;document.getElementById("ar-sub").textContent="Suivez la flèche";updateStatus();}
        }
      },300);
    };
  }
});

window.closeSheet=closeSheet;window.dismissArrived=dismissArrived;window.goBack=goBack;
window.addEventListener("pagehide",function(){
  if(AR.stream)AR.stream.getTracks().forEach(function(t){t.stop();});
  if(AR.watchId!==null)navigator.geolocation.clearWatch(AR.watchId);
});
</script>
</body>
</html>
