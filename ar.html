<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vue AR — Ferrières-en-Brie</title>
  <meta name="theme-color" content="#1A2540">
  <script src="./data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #fff;
    }

    /* CAMERA */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* OVERLAY */
    #ar-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* AR MARKERS */
    .ar-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .ar-bubble {
      background: rgba(26,37,64,0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 10px 14px;
      min-width: 120px;
      max-width: 160px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      transition: transform 0.15s;
    }
    .ar-marker:active .ar-bubble { transform: scale(0.95); }
    .ar-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .ar-dist {
      font-size: 11px;
      opacity: 0.7;
      font-weight: 500;
    }
    .ar-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin: 6px auto 0;
    }
    .ar-stem {
      width: 2px;
      height: 14px;
      background: rgba(255,255,255,0.5);
      margin: 0 auto;
    }
    .ar-tip {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto;
      box-shadow: 0 0 8px #fff;
    }

    /* COMPASS */
    #compass {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #compass.active { display: flex; }
    #compass-ring {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(26,37,64,0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #compass-arrow {
      width: 4px; height: 28px;
      background: linear-gradient(180deg, #ef4444 50%, rgba(255,255,255,0.4) 50%);
      border-radius: 999px;
      transform-origin: center bottom;
      position: absolute;
      bottom: 50%;
      left: calc(50% - 2px);
    }
    #compass-dist-badge {
      background: rgba(26,37,64,0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    #compass-target {
      font-size: 11px;
      opacity: 0.7;
      max-width: 80px;
      text-align: center;
      line-height: 1.3;
    }

    /* HEADER */
    #ar-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      pointer-events: auto;
    }
    #btn-ar-back {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-ar-back svg { width: 20px; height: 20px; }
    #ar-title {
      font-size: 16px;
      font-weight: 700;
    }
    #ar-subtitle {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 1px;
    }

    /* STATUS BAR */
    #ar-status {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 50;
      pointer-events: none;
    }
    #ar-status-text {
      text-align: center;
      font-size: 13px;
      opacity: 0.75;
    }
    #ar-status-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      opacity: 0.4;
    }
    .status-dot.ok { opacity: 1; background: #4ADE80; }
    .status-dot.pending { opacity: 1; background: #FBBF24; }
    .status-dot.err { opacity: 1; background: #EF4444; }
    .status-dot.idle { background: #fff; }

    /* DETAIL SHEET */
    #ar-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      color: #111;
      border-radius: 22px 22px 0 0;
      z-index: 60;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      max-height: 70vh;
      overflow-y: auto;
    }
    #ar-sheet.open { transform: translateY(0); }
    #ar-sheet::-webkit-scrollbar { display: none; }
    .ar-sheet-handle {
      padding: 12px 0 0;
      display: flex; justify-content: center;
    }
    .ar-sheet-handle-bar {
      width: 36px; height: 4px;
      background: #E5E0D5;
      border-radius: 999px;
    }
    #ar-sheet-content { padding: 12px 20px 24px; }
    #ar-sheet-name {
      font-size: 20px;
      font-weight: 800;
      color: #111;
      margin-bottom: 6px;
    }
    #ar-sheet-cat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    #ar-sheet-desc {
      font-size: 15px;
      line-height: 1.6;
      color: #4B5563;
      margin-bottom: 16px;
    }
    #ar-sheet-btns {
      display: flex;
      gap: 10px;
    }
    .ar-sheet-btn {
      flex: 1;
      height: 50px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .ar-sheet-btn.primary { background: #1A2540; color: #fff; }
    .ar-sheet-btn.secondary { background: #F5F3EE; color: #1A2540; }
    .ar-sheet-btn svg { width: 18px; height: 18px; }

    /* PERMISSION SCREEN */
    #perm-screen {
      position: fixed;
      inset: 0;
      background: #1A2540;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    #perm-screen.hidden { display: none; }
    #perm-screen h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    #perm-screen p { font-size: 15px; opacity: 0.7; line-height: 1.6; margin-bottom: 28px; }
    #btn-start-ar {
      width: 100%;
      max-width: 320px;
      height: 54px;
      background: #fff;
      color: #1A2540;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-start-ar:active { opacity: 0.85; }
  </style>
</head>
<body>

  <!-- PERMISSION SCREEN -->
  <div id="perm-screen">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px;opacity:0.7"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
    <h2>Vue Réalité Augmentée</h2>
    <p>L'application va demander l'accès à votre caméra, votre GPS et l'orientation de l'appareil pour afficher les bâtiments dans votre champ de vision.</p>
    <button id="btn-start-ar">Activer la vue AR</button>
  </div>

  <!-- CAMERA FEED -->
  <video id="camera" autoplay playsinline muted></video>

  <!-- AR OVERLAY -->
  <div id="ar-overlay"></div>

  <!-- COMPASS (shown when navigating) -->
  <div id="compass">
    <div id="compass-ring">
      <div id="compass-arrow"></div>
    </div>
    <div id="compass-dist-badge">— m</div>
    <div id="compass-target">—</div>
  </div>

  <!-- HEADER -->
  <div id="ar-header">
    <button id="btn-ar-back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <div>
      <div id="ar-title">Réalité Augmentée</div>
      <div id="ar-subtitle">Pointez vers les bâtiments</div>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div id="ar-status">
    <div id="ar-status-text">Initialisation...</div>
    <div id="ar-status-dots">
      <div class="status-dot idle" id="dot-camera" title="Caméra"></div>
      <div class="status-dot idle" id="dot-gps" title="GPS"></div>
      <div class="status-dot idle" id="dot-orient" title="Orientation"></div>
    </div>
  </div>

  <!-- DETAIL SHEET -->
  <div id="ar-sheet">
    <div class="ar-sheet-handle"><div class="ar-sheet-handle-bar"></div></div>
    <div id="ar-sheet-content">
      <div id="ar-sheet-name">—</div>
      <div id="ar-sheet-cat"></div>
      <div id="ar-sheet-desc">—</div>
      <div id="ar-sheet-btns">
        <button class="ar-sheet-btn secondary" onclick="closeArSheet()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          Fermer
        </button>
        <button class="ar-sheet-btn primary" id="btn-ar-navigate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          Naviguer
        </button>
      </div>
    </div>
  </div>

  <script>
  var AR = {
    stream: null,
    heading: 0,
    lat: null,
    lng: null,
    watchId: null,
    orientOk: false,
    gpsOk: false,
    cameraOk: false,
    navTarget: null,
    fov: 60
  };

  // ── UTILS ──────────────────────────────────────────────────────
  function haversine(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function bearing(lat1, lng1, lat2, lng2) {
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var y = Math.sin(dLng) * Math.cos(lat2 * Math.PI / 180);
    var x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLng);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function formatDist(m) {
    if (m < 1000) return Math.round(m) + " m";
    return (m/1000).toFixed(1) + " km";
  }

  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  // ── STATUS DOTS ────────────────────────────────────────────────
  function setDot(id, state) {
    var el = document.getElementById("dot-" + id);
    if (!el) return;
    el.className = "status-dot " + state;
  }

  function updateStatus() {
    var msgs = [];
    if (!AR.cameraOk) msgs.push("Caméra en attente");
    if (!AR.gpsOk)    msgs.push("GPS en attente");
    if (!AR.orientOk) msgs.push("Orientation en attente");
    if (msgs.length === 0) {
      document.getElementById("ar-status-text").textContent = "Vue AR active — " + BATIMENTS.length + " bâtiments";
    } else {
      document.getElementById("ar-status-text").textContent = msgs.join(" · ");
    }
  }

  // ── CAMERA ────────────────────────────────────────────────────
  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function(stream) {
        AR.stream = stream;
        document.getElementById("camera").srcObject = stream;
        AR.cameraOk = true;
        setDot("camera", "ok");
        updateStatus();
      })
      .catch(function() {
        setDot("camera", "err");
        document.getElementById("ar-status-text").textContent = "Caméra inaccessible";
      });
  }

  // ── GPS ───────────────────────────────────────────────────────
  function startGPS() {
    if (!navigator.geolocation) {
      setDot("gps", "err");
      return;
    }
    setDot("gps", "pending");
    AR.watchId = navigator.geolocation.watchPosition(
      function(pos) {
        AR.lat = pos.coords.latitude;
        AR.lng = pos.coords.longitude;
        AR.gpsOk = true;
        setDot("gps", "ok");
        updateStatus();
        updateCompass();
        renderMarkers();
      },
      function() { setDot("gps", "err"); },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
    );
  }

  // ── ORIENTATION ───────────────────────────────────────────────
  function startOrientation() {
    function onOrient(e) {
      var alpha = e.webkitCompassHeading || (e.alpha ? (360 - e.alpha) : 0);
      AR.heading = alpha;
      AR.orientOk = true;
      setDot("orient", "ok");
      renderMarkers();
      updateCompass();
    }

    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission()
        .then(function(p) {
          if (p === "granted") {
            window.addEventListener("deviceorientation", onOrient, true);
          } else {
            setDot("orient", "err");
          }
        })
        .catch(function() { setDot("orient", "err"); });
    } else {
      window.addEventListener("deviceorientation", onOrient, true);
    }
  }

  // ── RENDER AR MARKERS ─────────────────────────────────────────
  function renderMarkers() {
    if (!AR.gpsOk || !AR.orientOk) return;

    var overlay = document.getElementById("ar-overlay");
    overlay.innerHTML = "";

    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var halfFov = AR.fov / 2;

    for (var i = 0; i < BATIMENTS.length; i++) {
      var b = BATIMENTS[i];
      if (!b.lat || !b.lng) continue;

      var dist = haversine(AR.lat, AR.lng, b.lat, b.lng);
      if (dist > 1500) continue;

      var bear = bearing(AR.lat, AR.lng, b.lat, b.lng);
      var diff = bear - AR.heading;
      while (diff > 180) diff -= 360;
      while (diff < -180) diff += 360;

      if (Math.abs(diff) > halfFov + 5) continue;

      var x = vw / 2 + (diff / halfFov) * (vw / 2);
      // Y: closer = lower on screen
      var yFactor = Math.min(dist / 400, 1);
      var y = vh * 0.25 + yFactor * vh * 0.35;

      var color = (CATEGORIES[b.categorie] && CATEGORIES[b.categorie].color) || "#1A2540";
      var opacity = Math.max(0.4, 1 - (dist / 1500));

      var el = document.createElement("div");
      el.className = "ar-marker";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.opacity = opacity;

      el.innerHTML =
        '<div class="ar-bubble">' +
          '<div class="ar-name">' + b.nom + '</div>' +
          '<div class="ar-dist">' + formatDist(dist) + '</div>' +
          '<div class="ar-dot" style="background:' + color + '"></div>' +
        '</div>' +
        '<div class="ar-stem"></div>' +
        '<div class="ar-tip"></div>';

      (function(building) {
        el.addEventListener("click", function() {
          openArSheet(building);
        });
      })(b);

      overlay.appendChild(el);
    }
  }

  // ── AR SHEET ──────────────────────────────────────────────────
  function openArSheet(b) {
    document.getElementById("ar-sheet-name").textContent = b.nom;

    var color = (CATEGORIES[b.categorie] && CATEGORIES[b.categorie].color) || "#1A2540";
    var catLabel = (CATEGORIES[b.categorie] && CATEGORIES[b.categorie].label) || b.categorie;
    var catEl = document.getElementById("ar-sheet-cat");
    catEl.style.background = hexToRgba(color, 0.12);
    catEl.style.color = color;
    catEl.textContent = catLabel;

    document.getElementById("ar-sheet-desc").textContent = b.description || "Bâtiment public communal.";

    document.getElementById("btn-ar-navigate").onclick = function() {
      AR.navTarget = b;
      document.getElementById("compass").classList.add("active");
      document.getElementById("compass-target").textContent = b.nom;
      updateCompass();
      closeArSheet();
    };

    document.getElementById("ar-sheet").classList.add("open");
  }

  function closeArSheet() {
    document.getElementById("ar-sheet").classList.remove("open");
  }

  // ── COMPASS (navigation) ──────────────────────────────────────
  function updateCompass() {
    if (!AR.navTarget || !AR.gpsOk) return;
    var b = AR.navTarget;
    var dist = haversine(AR.lat, AR.lng, b.lat, b.lng);
    var bear = bearing(AR.lat, AR.lng, b.lat, b.lng);
    var relBear = bear - AR.heading;

    document.getElementById("compass-arrow").style.transform = "rotate(" + relBear + "deg)";
    document.getElementById("compass-dist-badge").textContent = formatDist(dist);

    if (dist < 20) {
      document.getElementById("compass-target").textContent = "Arrivé !";
      setTimeout(function() {
        AR.navTarget = null;
        document.getElementById("compass").classList.remove("active");
      }, 3000);
    }
  }

  // ── START ─────────────────────────────────────────────────────
  document.getElementById("btn-start-ar").onclick = function() {
    document.getElementById("perm-screen").classList.add("hidden");
    startCamera();
    startGPS();
    startOrientation();
    updateStatus();

    // Render loop
    setInterval(renderMarkers, 200);
  };

  window.closeArSheet = closeArSheet;

  // Stop camera when leaving
  window.addEventListener("pagehide", function() {
    if (AR.stream) {
      AR.stream.getTracks().forEach(function(t) { t.stop(); });
    }
    if (AR.watchId !== null) {
      navigator.geolocation.clearWatch(AR.watchId);
    }
  });
  </script>
</body>
</html>
